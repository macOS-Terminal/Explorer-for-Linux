#
# Explorer for Linux — Hyprland drop-in
# 安装器会将本文件复制为 ~/.config/explorer-linux/hyprland-dropin.conf
# 然后在你的 hyprland.conf 末尾追加一行启用：
#
#     source = ~/.config/explorer-linux/hyprland-dropin.conf
#
# winlogin.exe 会监控并反复拉起 explorer.exe；
# 会话终结受 EXPLORER_SESSION_KILL=1 门控：建议在执行器里写明该环境变量。
#

exec-once = $HOME/.local/bin/winlogin.exe

# 逃生通道：Shift+F10 强制退出并返回 TTY（需 EXPLORER_SESSION_KILL=1 才真正终止会话）
bind = SHIFT ALT, F10, exec, $HOME/.local/bin/explorer-killall --session